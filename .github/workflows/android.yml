name: Android APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: Подготовить файлы игры (three.js кладём локально — игра работает без интернета)
        run: |
          mkdir -p app/www && cp -r index.html icons manifest.webmanifest app/www/
          curl -sSL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' app/www/index.html
      - name: Собрать APK через Capacitor
        working-directory: app
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Сектор 5×5" ru.arturok.sector5x5 --web-dir www
          npx cap add android
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do for f in ic_launcher ic_launcher_round ic_launcher_foreground; do [ -f android/app/src/main/res/mipmap-$d/$f.png ] && cp www/icons/icon-192.png android/app/src/main/res/mipmap-$d/$f.png; done; done
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../sector-5x5.apk
      - uses: actions/upload-artifact@v4
        with: {name: sector-5x5-apk, path: sector-5x5.apk}
      - name: Выложить в «Releases» (ссылка для скачивания с сайта)
        uses: softprops/action-gh-release@v2
        with: {tag_name: latest, name: "Сектор 5×5 — последняя версия", files: sector-5x5.apk, make_latest: true}
